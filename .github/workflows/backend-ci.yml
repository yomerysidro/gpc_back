name: Backend CI

on:
  push:
    branches: [main]

concurrency:
  group: backend-ci-main-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  php:
    name: Ejecutar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: certificados_morales_test
          POSTGRES_USER: gpc_test
          POSTGRES_PASSWORD: gpc_test_only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U gpc_test -d certificados_morales_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, gd, pdo_sqlite, pdo_pgsql, zip, intl
          tools: composer:2.11.2
          ini-values: memory_limit=512M
          coverage: none
      - name: Validar Composer y obtener ruta de caché
        id: composer
        run: |
          composer validate --strict
          echo "path=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer.outputs.path }}
          key: ${{ runner.os }}-php83-composer-${{ hashFiles('composer.lock') }}
      - name: Instalar dependencias del lock
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer check-platform-reqs
      - name: Comprobar sintaxis PHP y arranque
        run: |
          git ls-files -z '*.php' | xargs -0 -r -n1 php -l
          echo "APP_KEY=$(php artisan key:generate --show --no-interaction)" >> "$GITHUB_ENV"
      - name: Suite PHPUnit con SQLite en memoria
        run: vendor/bin/phpunit
      - name: Contrato con PostgreSQL desechable
        env:
          MODULES_PG_TEST_URL: postgres://gpc_test:gpc_test_only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/certificados_morales_test
          MODULES_PG_TEST_EXCLUSIVE: '1'
        run: vendor/bin/phpunit -c phpunit.postgresql.xml --fail-on-skipped

  docker:
    name: Construir
    needs: php
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir con el Dockerfile del repositorio
        run: |
          source_dir=$(mktemp -d)
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$source_dir"
          docker build --tag "gpc-back:$GITHUB_SHA" "$source_dir"
          docker save "gpc-back:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/gpc-back.tar.gz"
      - name: Guardar imagen construida
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/gpc-back.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verificar
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperar imagen construida
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: gpc-back.tar.gz
          path: ${{ runner.temp }}
      - name: Cargar imagen y comprobar etiqueta
        run: |
          docker load --input "$RUNNER_TEMP/gpc-back.tar.gz"
          docker image inspect "gpc-back:$GITHUB_SHA" > /dev/null
      - name: Verificar arranque, volumen, salud y parada
        run: |
          docker run --detach --name gpc-ci --publish 127.0.0.1:18087:8087 \
            --volume /var/www/httpdocs/storage/app/private \
            --env PORT=8087 --env RAILWAY_ENVIRONMENT_ID=ci \
            --env APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --env JWT_SECRET=ci-only-0123456789abcdef0123456789abcdef "gpc-back:$GITHUB_SHA"
          if ! status=$(curl --fail --silent --show-error --retry 30 --retry-all-errors \
            --retry-delay 1 --retry-max-time 45 --max-time 3 \
            --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18087/up) || [[ "$status" != 200 ]]; then
            echo "::error::El contenedor no devolvió HTTP 200 en /up (HTTP ${status:-sin respuesta})."
            docker inspect --format '{{json .State}}' gpc-ci
            docker logs gpc-ci
            exit 1
          fi
          docker exec --user www-data gpc-ci test -w /var/www/httpdocs/storage/app/private
          docker stop --time 20 gpc-ci
          test "$(docker inspect --format '{{.State.ExitCode}}' gpc-ci)" = 0
      - name: Limpiar contenedor de pruebas
        if: always()
        run: |
          if docker container inspect gpc-ci >/dev/null 2>&1; then
            docker rm --force --volumes gpc-ci
          fi

name: Backend Deploy Railway

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: SHA completo del commit revisado en la rama de producción
        required: true
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: railway-backend-production
  cancel-in-progress: false

jobs:
  verify:
    name: Acreditar autorización y CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_BRANCH: main
      EXPECTED_SHA: ${{ inputs.commit_sha }}
      REF_PROTECTED: ${{ github.ref_protected }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    steps:
      - name: Verificar rama protegida, commit y pruebas del push
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/$PRODUCTION_BRANCH" ]] \
            || fail "Selecciona la rama de producción main."
          [[ "$REF_PROTECTED" == true ]] || fail "La rama de producción debe estar protegida."
          [[ "$GITHUB_ACTOR" == "$REPOSITORY_OWNER" && "$TRIGGERING_ACTOR" == "$REPOSITORY_OWNER" ]] \
            || fail "La publicación requiere la cuenta propietaria del repositorio."
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]] \
            || fail "El SHA autorizado debe coincidir con el commit seleccionado por GitHub."

          api="repos/$GITHUB_REPOSITORY/actions"
          run_id=$(gh api --method GET "$api/workflows/backend-ci.yml/runs" \
            -f branch="$PRODUCTION_BRANCH" -f head_sha="$GITHUB_SHA" -f event=push -F per_page=1 \
            | jq -er --arg sha "$GITHUB_SHA" --arg branch "$PRODUCTION_BRANCH" \
              '.workflow_runs[0] | select(.head_sha == $sha and .head_branch == $branch and .event == "push" and .status == "completed" and .conclusion == "success") | .id') \
            || fail "Falta una CI exitosa del push para este SHA y esta rama."
          gh api "$api/runs/$run_id/jobs?filter=latest" \
            | jq -e '["PHP y pruebas", "Imagen Docker"] - [.jobs[] | select(.status == "completed" and .conclusion == "success") | .name] == []' >/dev/null \
            || fail "Los dos trabajos obligatorios deben haber concluido con éxito."
          echo "CI $run_id aprobada para $GITHUB_SHA."

  deploy:
    name: Publicar en Railway
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Instalar Railway CLI fijada
        working-directory: ${{ runner.temp }}
        run: |
          npm install --prefix "$RUNNER_TEMP/railway-cli" --no-audit --no-fund --ignore-scripts=false @railway/cli@5.75.0
          echo "$RUNNER_TEMP/railway-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Confirmar revisión vigente y preparar archivos versionados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::La rama avanzó. Revisa la CI del nuevo SHA y autoriza una nueva ejecución."
            exit 1
          fi
          source_dir=$(mktemp -d)
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$source_dir"
          echo "GPC_SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
      - name: Desplegar y esperar activación
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_HEALTH_URL: ${{ vars.RAILWAY_HEALTH_URL }}
        run: |
          for setting in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_SERVICE_ID RAILWAY_HEALTH_URL; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Falta configurar $setting."
              exit 1
            fi
          done
          if [[ ! "$RAILWAY_HEALTH_URL" =~ ^https://[a-zA-Z0-9.-]+/up$ ]]; then
            echo "::error::RAILWAY_HEALTH_URL debe ser una URL HTTPS pública al endpoint /up."
            exit 1
          fi
          cd "$GPC_SOURCE_DIR"
          target=(--project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID")
          if ! railway deployment list "${target[@]}" --json 2>/dev/null \
            | jq -e 'type == "array" and all(.[]; .status | IN("SUCCESS", "FAILED", "CRASHED", "REMOVED", "SKIPPED"))' >/dev/null; then
            echo "::error::Hay un despliegue en curso o no se pudo confirmar el estado de Railway."
            exit 1
          fi
          echo "Railway: enviando $GITHUB_SHA y esperando estado terminal."
          if ! railway up . --path-as-root --no-gitignore "${target[@]}" --json \
            --message "gpc_back $GITHUB_SHA (Actions $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT)" </dev/null 2>/dev/null \
            | jq -se 'last | .status == "success"' >/dev/null; then
            echo "::error::Railway no confirmó la activación. Busca el SHA en Deployments y revisa estado y logs antes de reintentar."
            exit 1
          fi
          unset RAILWAY_TOKEN
          if ! status=$(curl --proto '=https' --silent --show-error --connect-timeout 5 --max-time 10 \
            --output /dev/null --write-out '%{http_code}' --retry 5 --retry-all-errors --retry-delay 2 \
            --fail "$RAILWAY_HEALTH_URL") || [[ "$status" != 200 ]]; then
            echo "::error::Railway informó activación, pero el endpoint público no devolvió HTTP 200."
            exit 1
          fi
          printf '## Railway activado\n\n- Commit: %s\n- Salud pública: HTTP %s\n' "$GITHUB_SHA" "$status" >> "$GITHUB_STEP_SUMMARY"
